<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshift — a stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0c12;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    width: 1280px;
    max-width: 100vw;
    text-align: center;
  }
  canvas {
    width: 1280px;
    max-width: 100vw;
    height: auto;
    display: block;
    background: #14101c;
    cursor: crosshair;
    image-rendering: auto;
  }
  #note {
    color: #6b7488;
    font-size: 12px;
    margin: 6px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <p id="note">Nightshift — lift 3 Star Charts per gallery and leave by the east door, unseen. No network, no libraries: just this page.</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
